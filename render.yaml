services:
  - type: web
    name: mediafetch
    # Usa el Dockerfile para que Render instale FFmpeg y el extractor con sus componentes.
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # Render consulta esta ruta para comprobar que la API arrancó y responde.
    healthCheckPath: /api/status
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
