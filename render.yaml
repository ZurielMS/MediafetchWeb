services:
  - type: web
    name: mediafetch
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      # Opcional: Agrega tus cookies de YouTube aquí para evitar el error 422
      # - key: YOUTUBE_COOKIES
      #   value: "VISITOR_INFO1_LIVE=...\nYSC=...\n..."
      # Opcional: Agrega un proxy si necesitas bypasear restricciones
      # - key: HTTP_PROXY
      #   value: "http://proxy.example.com:3128"
